<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolajon Olami</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7d6;--card:#fff;--ink:#3b2a6b;--shadow:rgba(60,40,110,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2350;--card:#3d3475;--ink:#fff6d6;--shadow:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#2a2350;--card:#3d3475;--ink:#fff6d6;--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:10px}
h1{margin:0;font-size:clamp(24px,6vw,40px);font-weight:800}
.stars{background:var(--card);border-radius:30px;padding:6px 18px;font-size:26px;font-weight:800;box-shadow:0 4px 0 var(--shadow)}
main{max-width:900px;margin:0 auto;padding:0 14px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.tile{border:0;border-radius:28px;padding:20px 8px;color:#fff;font:inherit;font-weight:800;font-size:clamp(20px,4.5vw,26px);cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .1s;display:flex;flex-direction:column;align-items:center;gap:4px}
.tile:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile .em{font-size:clamp(54px,12vw,80px);line-height:1.1;animation:bob 2.4s ease-in-out infinite}
.tile small{font-size:15px;font-weight:600;opacity:.95}
.back{border:0;background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:22px;border-radius:24px;padding:8px 22px;box-shadow:0 5px 0 var(--shadow);cursor:pointer;margin-bottom:12px}
.prompt{text-align:center;background:var(--card);border-radius:30px;padding:20px 12px;box-shadow:0 6px 0 var(--shadow);font-size:26px;font-weight:700;margin-bottom:18px}
.items{font-size:clamp(40px,9vw,60px);line-height:1.25;word-break:break-all}
.big{font-size:clamp(80px,22vw,130px);line-height:1.1}
.blob{width:130px;height:130px;border-radius:50%;margin:0 auto 8px;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ans{border:0;border-radius:26px;background:#6c5ce7;color:#fff;font:inherit;font-weight:800;font-size:clamp(40px,10vw,64px);padding:16px 4px;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.2)}
.ans.txt{font-size:clamp(22px,5vw,34px)}
.ans:nth-child(2){background:#00b894}.ans:nth-child(3){background:#e17055}
.ans.ok{background:#2ecc71!important;animation:pop .5s}
.ans.no{animation:shake .4s;opacity:.55}
.letter-card{background:var(--card);border-radius:30px;padding:16px;text-align:center;box-shadow:0 6px 0 var(--shadow);margin-bottom:16px}
.letter-card .em{font-size:90px;line-height:1.1}
.letter-card .L{font-size:70px;font-weight:800;color:#e17055;line-height:1}
.letter-card .w{font-size:30px;font-weight:700}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.abc button{border:0;border-radius:18px;background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:30px;padding:10px 0;cursor:pointer;box-shadow:0 5px 0 var(--shadow)}
.abc button.on{background:#fdcb6e;color:#3b2a6b}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px;margin:0 auto}
.card{aspect-ratio:1;border:0;border-radius:24px;background:#6c5ce7;color:#fff;font-size:clamp(40px,12vw,64px);cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);font-family:inherit}
.card.up{background:var(--card)}
.card.done{background:#b8f2c6;animation:pop .5s}
.sky{position:relative;height:min(62vh,520px);border-radius:30px;background:linear-gradient(#8fd3ff,#d9f2ff);overflow:hidden;box-shadow:0 6px 0 var(--shadow)}
.cnt{text-align:center;font-size:26px;font-weight:800;margin-top:12px}
.balloon{position:absolute;bottom:-170px;width:110px;height:134px;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;cursor:pointer;animation:rise linear forwards}
.balloon:after{content:"";position:absolute;left:50%;top:100%;width:2px;height:30px;background:#555}
.fx{position:fixed;pointer-events:none;font-size:30px;z-index:9;animation:fly .8s ease-out forwards}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px;max-width:900px;margin:0 auto}
nav button{border:0;border-radius:20px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:17px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 0 var(--shadow)}
nav button.on{background:#6c5ce7;color:#fff}
.box{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 6px 0 var(--shadow);margin-bottom:16px;font-size:19px;line-height:1.5}
.box h2{margin:0 0 8px;font-size:28px}.hero{text-align:center}.hero .em{font-size:80px}
.btn{border:0;border-radius:22px;background:#00b894;color:#fff;font:inherit;font-weight:800;font-size:20px;padding:10px 22px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);text-decoration:none;display:inline-block;margin:4px}
.btn.o{background:#e17055}.btn.g{background:#6c5ce7}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.lc{border:0;border-radius:22px;background:var(--card);color:var(--ink);font:inherit;font-weight:800;padding:12px 4px;cursor:pointer;box-shadow:0 5px 0 var(--shadow);font-size:20px}
.lc b{display:block;font-size:44px;line-height:1.1}
.card-no{font-size:26px;font-weight:800;letter-spacing:2px;background:#fff3b0;color:#3b2a6b;border-radius:16px;padding:10px;text-align:center;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--shadow);padding:8px 0;flex-wrap:wrap}
canvas{width:100%;border-radius:24px;background:#fff;touch-action:none;box-shadow:0 6px 0 var(--shadow)}
button:focus-visible{outline:4px solid #f59e0b;outline-offset:3px}
.ws{margin:12px 0}.wr{display:flex;gap:16px;align-items:center;font-size:30px;padding:6px 10px;border-bottom:2px dashed #999;flex-wrap:wrap}.tr{color:#bbb;font-weight:800}
@media print{header,nav,.noprint{display:none!important}body{background:#fff!important;color:#000!important}.ws{margin:0}.wr{break-inside:avoid;font-size:24px}}
.lvb{color:var(--ink)}
.lvb.on{color:#3b2a6b}
nav button{min-height:48px}
.lvbar{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.lvb{border:0;border-radius:999px;padding:10px 18px;font:inherit;font-size:20px;font-weight:700;background:var(--card);color:#3b2a6b;cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.lvb.on{background:#fdcb6e}
.back{min-height:56px;font-size:24px}
.say{border:0;background:#fdcb6e;color:#3b2a6b;font:inherit;font-size:30px;border-radius:50%;width:56px;height:56px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);margin-top:8px}
.msg{text-align:center;font-size:28px;font-weight:800;min-height:44px;margin:-6px 0 12px}
.ans.no{pointer-events:none}
.ans.hint{animation:glow .7s ease-in-out infinite}
.ov{position:fixed;inset:0;background:rgba(40,30,80,.75);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov .box{max-width:420px;width:100%;text-align:center;margin:0}
.mute{border:0;background:var(--card);border-radius:50%;width:48px;height:48px;font-size:24px;cursor:pointer;box-shadow:0 4px 0 var(--shadow)}
@keyframes glow{50%{transform:scale(1.1);box-shadow:0 0 0 8px #fdcb6e}}
@media (prefers-reduced-motion:reduce){.tile .em,.ans.hint{animation:none}}
*{touch-action:manipulation}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes rise{to{transform:translateY(-760px)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
</style>
<meta name="theme-color" content="#6c5ce7"><link rel="manifest" href="manifest.json"></head>
<body>
<header><h1>🌈 Bolajon Olami</h1><div style="display:flex;gap:8px;align-items:center"><button class="mute" id="th" aria-label="Mavzu: kun/tun">🌙</button><button class="mute" id="pv" style="display:none" aria-label="Mijoz koʻrinishi">👁️</button><button class="mute" id="mute" aria-label="Ovoz">🔊</button><div class="stars">⭐ <span id="stars">0</span></div></div></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
let stars=0,cleanup=null,ac,lvl=0,preview=false,muted=false,curIdx=0,curGame='';
const unlocked=()=>sub&&!preview;
const SAVE='bolajon_v1';let P={stars:0,g:{}};
try{P=Object.assign(P,JSON.parse(localStorage.getItem(SAVE)||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem(SAVE,JSON.stringify(P))}catch(e){}};
stars=P.stars||0;$('#stars').textContent=stars;
const DEFAULT_GIFTS=[{id:'lolli',e:'🍭',n:'Chupa chups',s:20},{id:'ice',e:'🍦',n:'Muzqaymoq',s:40},{id:'toy',e:'🧸',n:'Oʻyinchoq',s:60},{id:'book',e:'📚',n:'Rasmli kitob',s:80},{id:'park',e:'🎡',n:'Parkka sayr',s:100}];
const allGifts=()=>[...DEFAULT_GIFTS.map(g=>({...g,...((P.go||{})[g.id]||{})})),...(Array.isArray(P.cg)?P.cg:[])].filter(g=>!g.hidden);
function giftCheck(){if(allGifts().some(g=>g.s===stars&&!(P.claimed||{})[g.id])){burst(innerWidth/2,innerHeight/3,'🎁🍭🍦');setTimeout(()=>say('Sovga ochildi! Ota-onangdan soʻra!'),1500)}}
function track(ok){const g=P.g[curGame]=P.g[curGame]||{a:0,c:0,p:0};g.a++;if(ok)g.c++;persist()}
const rnd=n=>Math.floor(Math.random()*n),shuf=a=>[...a].sort(()=>Math.random()-.5);
function tone(f,d){if(muted)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const good=()=>{tone(660,.15);setTimeout(()=>tone(880,.25),120)},bad=()=>tone(200,.3);
function star(){stars++;$('#stars').textContent=stars;P.stars=stars;persist();if(stars%10==0){burst(innerWidth/2,innerHeight/2,'🎉🏆⭐🌈');say('Barakalla! Ofarin!')}giftCheck()}
const THK='bolajon_theme';let th=null;try{th=localStorage.getItem(THK)}catch(e){}
const applyTh=t=>{if(t){document.documentElement.dataset.theme=t;$('#th').textContent=t=='dark'?'☀️':'🌙'}};applyTh(th);
$('#th').onclick=()=>{const cur=document.documentElement.dataset.theme,dark=cur?cur=='dark':matchMedia('(prefers-color-scheme:dark)').matches;th=dark?'light':'dark';applyTh(th);try{localStorage.setItem(THK,th)}catch(e){}};
$('#pv').onclick=e=>{preview=!preview;e.currentTarget.style.background=preview?'#fdcb6e':'';go(cur=='bosh'||cur=='oyin'?cur:'oyin')};
$('#mute').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊';if(muted)try{speechSynthesis.cancel()}catch(x){}};
function burst(x,y,set='⭐✨🎉'){for(let i=0;i<8;i++){const s=document.createElement('span');s.className='fx';s.textContent=[...set][rnd([...set].length)];s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',(rnd(160)-80)+'px');s.style.setProperty('--dy',(rnd(140)-110)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}
function say(t){if(muted||!t)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='uz-UZ';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

const LET=[['A','Ari','🐝'],['B','Baliq','🐟'],['D','Daraxt','🌳'],['E','Echki','🐐'],['F','Fil','🐘'],['G','Gul','🌸'],['H','Hovli','🏡'],['I','Ilon','🐍'],['J','Jirafa','🦒'],['K','Kapalak','🦋'],['L','Limon','🍋'],['M','Mushuk','🐱'],['N','Non','🍞'],['O','Olma','🍎'],['Oʻ','Oʻrdak','🦆'],['Gʻ','Gʻisht','🧱'],['P','Pomidor','🍅'],['Q','Qush','🐦'],['R','Raketa','🚀'],['S','Sichqon','🐭'],['T','Tuya','🐪'],['U','Uzum','🍇'],['V','Velosiped','🚲'],['X','Xoʻroz','🐓'],['Y','Yulduz','⭐'],['Z','Zebra','🦓'],['Sh','Shar','🎈'],['Ch','Choy','🍵']];
const COL=[['Qizil','#ef4444'],['Koʻk','#3b82f6'],['Sariq','#facc15'],['Yashil','#22c55e'],['Toʻq sariq','#fb923c'],['Binafsha','#a855f7'],['Pushti','#ec4899']];

function quiz(el,gen){
  let qn=0;const finish=()=>result(el,qn+' ta savolga javob berding!');
  (function next(){
    const q=gen();el.innerHTML=`<div class="prompt">${q.p}<br><button class="say" aria-label="Tinglash">🔊</button></div><div class="msg"></div><div class="answers"></div>`;const speak=()=>say(q.speak||el.querySelector('.prompt').innerHTML.replace(/<[^>]*>/g,' ').replace(/\p{Extended_Pictographic}/gu,'').replace(/\s+/g,' ').trim());el.querySelector('.say').onclick=speak;setTimeout(speak,350);let miss=0;const msg=el.querySelector('.msg');
    const box=el.querySelector('.answers');let done=false;
    shuf(q.a).forEach(a=>{const b=document.createElement('button');b.className='ans'+(q.txt?' txt':'');b.innerHTML=a.l;
      b.onclick=e=>{if(done)return;if(a.ok){done=true;track(1);good();star();msg.textContent=['Barakalla! 🎉','Ofarin! 🌟','Zoʻr! 👏','Aqlli bola! 🦄'][rnd(4)];say(q.say||msg.textContent.replace(/\p{Extended_Pictographic}/gu,''));b.classList.add('ok');const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top);setTimeout(()=>{++qn>=10?finish():next()},1100)}else{track(0);bad();b.classList.add('no');msg.textContent='Yana urinib koʻr! 💪';say('Yana urinib koʻr');mascot(['Hech qisi yoʻq, yana urinib koʻr!','Diqqat bilan qara 👀','Sen uddalaysan!'][rnd(3)]);if(++miss>=2)box.querySelectorAll('button').forEach(k=>{if(!k.classList.contains('no'))k.classList.add('hint')})}};
      box.appendChild(b)});
  })();
}
const others=(pool,cur,n)=>shuf(pool.filter(x=>x!==cur)).slice(0,n);

const games=[
{name:'Sanash',sub:'Nechta bor?',em:'🍎',c:'#ef4444',run(el){
  const E=['🍎','🐥','🌟','🎈','🚗','🐟','🍓','🐶'];
  quiz(el,()=>{const mx=[5,9,15][lvl],mn=[1,1,6][lvl],n=mn+rnd(mx-mn+1),e=E[rnd(E.length)];const o=others(Array.from({length:mx+1},(_,i)=>i+1),n,2);
    return{p:`<div class="items">${e.repeat(n)}</div>Nechta?`,a:[{l:n,ok:1},...o.map(x=>({l:x}))]}});
}},
{name:'Harflar',sub:'Harflarni oʻrgan',em:'🔤',c:'#3b82f6',run(el){
  el.innerHTML=`<div class="letter-card"><div class="em"></div><div class="L"></div><div class="w"></div></div><div class="abc"></div>`;
  const abc=el.querySelector('.abc');
  const show=i=>{const [l,w,e]=LET[i];el.querySelector('.em').textContent=e;el.querySelector('.L').textContent=l+' '+l.toLowerCase();el.querySelector('.w').textContent=w;[...abc.children].forEach((b,j)=>b.classList.toggle('on',i===j));tone(500+i*15,.15);say(w)};
  LET.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x[0];b.onclick=()=>show(i);abc.appendChild(b)});show(0);
}},
{name:'Qaysi harf?',sub:'Birinchi harfni top',em:'🅰️',c:'#10b981',run(el){
  quiz(el,()=>{const P=LET.slice(0,[8,18,28][lvl]),it=P[rnd(P.length)];const o=others(P.map(x=>x[0]),it[0],2);
    return{p:`<div class="big">${it[2]}</div>Bu qaysi harfdan boshlanadi?`,a:[{l:it[0],ok:1},...o.map(x=>({l:x}))]}});
}},
{name:'Ranglar',sub:'Rangni top',em:'🎨',c:'#a855f7',run(el){
  quiz(el,()=>{const P=COL.slice(0,[3,5,7][lvl]),c=P[rnd(P.length)];const o=others(P,c,2);
    return{txt:1,p:`<div class="blob" style="background:${c[1]}"></div>Bu qanday rang?`,a:[{l:c[0],ok:1},...o.map(x=>({l:x[0]}))]}});
}},
{name:'Xotira',sub:'Juftini top',em:'🧠',c:'#f59e0b',run(el){
  const E=shuf(['🐶','🐱','🐰','🦁','🐸','🐼','🐵','🦊']).slice(0,[3,6,8][lvl]);const deck=shuf([...E,...E]);
  el.innerHTML='<div class="mem"></div>';const g=el.firstChild;let open=[],lock=false,found=0;
  deck.forEach(e=>{const b=document.createElement('button');b.className='card';b.textContent='❓';
    b.onclick=()=>{if(lock||b.classList.contains('up')||b.classList.contains('done'))return;b.classList.add('up');b.textContent=e;tone(520,.1);open.push(b);
      if(open.length===2){lock=true;const[x,y]=open;
        if(x.textContent===y.textContent){setTimeout(()=>{x.className=y.className='card done';good();star();found++;open=[];lock=false;if(found===E.length){const r=g.getBoundingClientRect();burst(r.left+r.width/2,r.top+100,'🎉🏆⭐');setTimeout(()=>result(el,E.length+' ta juftni topding!'),1800)}},500)}
        else setTimeout(()=>{[x,y].forEach(k=>{k.classList.remove('up');k.textContent='❓'});open=[];lock=false},900)}};
    g.appendChild(b)});
}},
{name:'Sharlar',sub:'Sharlarni yor!',em:'🎈',c:'#ec4899',run(el){
  el.innerHTML='<div class="sky"></div><div class="cnt">🎈 Yorilgan: <span id="pc">0</span></div>';
  const sky=el.firstChild,cols=['#ef4444','#3b82f6','#facc15','#22c55e','#fb923c','#a855f7','#ec4899'];let n=0;
  const t=setInterval(()=>{const b=document.createElement('div');b.className='balloon';b.style.background=cols[rnd(7)];b.style.left=rnd(Math.max(10,sky.clientWidth-120))+'px';b.style.animationDuration=(7+rnd(4))+'s';
    b.onpointerdown=e=>{const r=b.getBoundingClientRect();burst(r.left+39,r.top+40,'💥✨⭐');tone(300+rnd(400),.12);star();$('#pc').textContent=++n;b.remove()};
    b.onanimationend=()=>b.remove();sky.appendChild(b)},1100);
  cleanup=()=>clearInterval(t);
}},
{name:'Shakllar',sub:'Shaklni top',em:'🔷',c:'#0ea5e9',run(el){
  const S=[['Doira','<circle cx="50" cy="50" r="42"/>'],['Kvadrat','<rect x="15" y="15" width="70" height="70"/>'],['Uchburchak','<polygon points="50,10 92,88 8,88"/>'],['Toʻgʻri toʻrtburchak','<rect x="4" y="28" width="92" height="44"/>'],['Yurak','<path d="M50 88C10 58 8 25 30 18 42 14 50 24 50 30 50 24 58 14 70 18 92 25 90 58 50 88Z"/>'],['Yulduz','<polygon points="50,8 61,38 93,38 67,57 77,89 50,70 23,89 33,57 7,38 39,38"/>']];
  quiz(el,()=>{const s=S[rnd(S.length)],c=COL[rnd(COL.length)][1];const o=others(S,s,2);
    return{txt:1,say:s[0],p:`<svg viewBox="0 0 100 100" width="140" height="140" fill="${c}">${s[1]}</svg><div>Bu qanday shakl?</div>`,a:[{l:s[0],ok:1},...o.map(x=>({l:x[0]}))]}});
}},
{name:'Hayvon ovozi',sub:'Kim shunday deydi?',em:'🐮',c:'#84cc16',run(el){
  const A=[['Mushuk','🐱','Miyov'],['It','🐶','Vov-vov'],['Sigʻir','🐮','Mu-mu'],['Echki','🐐','Me-me'],['Tovuq','🐔','Qoʻq-qoʻq'],['Xoʻroz','🐓','Qoʻqiriqoʻ'],['Oʻrdak','🦆','Kvak-kvak'],['Qoʻy','🐑','Be-be'],['Ot','🐴','Iho-ho'],['Sher','🦁','Rrrr!']];
  quiz(el,()=>{const a=A[rnd(A.length)];const o=others(A,a,2);
    return{txt:1,say:a[2],p:`<div class="big">${a[1]}</div>${a[0]} qanday ovoz chiqaradi?`,a:[{l:a[2],ok:1},...o.map(x=>({l:x[2]}))]}});
